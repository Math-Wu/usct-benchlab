name: offline-devtools
on:
  push:
    branches: ["work/physics-agent-validation"]
    paths: [".github/workflows/offline-devtools.yml"]
permissions:
  contents: read
jobs:
  wheels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          pip download --only-binary=:all: --dest wheels black==26.5.1 ruff==0.16.6
      - uses: actions/upload-artifact@v4
        with:
          name: offline-devtools
          path: wheels/*.whl
          retention-days: 7
