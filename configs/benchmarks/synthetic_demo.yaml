name: synthetic_demo
case_glob: ${USCT_SYNTHETIC_CASE_GLOB:-data/synthetic_demo/cases/*.h5}
outputs:
  root: ${USCT_RUN_ROOT:-runs/usctbench_runs}
algorithms:
  - name: straight_cgls
    config: configs/algorithms/cgls.yaml
  - name: straight_sirt
    config: configs/algorithms/sirt.yaml
  - name: straight_sart
    config: configs/algorithms/sart.yaml
  - name: bent_ray_gn
    config: configs/algorithms/bent_ray_smoke.yaml
# This suite contains TOF-only surrogates. Ray-Born requires complex pressure;
# it is validated separately in tests/algorithms/test_native_inversions.py.
min_cases: 1
min_records: 4
expected_statuses: [success]
required_metrics:
  default: [rmse, ssim, data_residual_norm, data_residual_reduction]
thresholds:
  default:
    rmse: 50.0
# Relative residual is undefined for the all-zero homogeneous delta-TOF case.
# Require non-increasing residual instead of replacing 0/0 by a fake score.
minimums:
  default:
    data_residual_reduction: 0.0
