[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "usct-benchlab"
version = "0.1.0"
description = "Lightweight benchmark package for ultrasound computed tomography reconstruction algorithms."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "usct-benchlab contributors" }
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "h5py>=3.8",
  "pydantic>=2.0",
  "PyYAML>=6.0",
  "scikit-image>=0.21"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff==0.16.6",
  "black==26.5.1"
]
viz = [
  "matplotlib>=3.7",
  "pillow>=10.0"
]
fwi = [
  "scipy>=1.10",
  "h5py>=3.8"
]

[project.scripts]
usct = "usctbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
target-version = ["py310"]

# Keep the historical correctness profile stable across Ruff default changes.
[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
